<!DOCTYPE html>
<html>
<body style="
  margin:0;
  padding:0;
  background:#f5f7fb;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;">
    <tr>
      <td align="center" style="padding:0;">

        <!-- Container -->
        <table width="1100" cellpadding="0" cellspacing="0" style="background:#ffffff;">

          <!-- Header -->
          <tr>
            <td style="
              background:#002663;
              color:#ffffff;
              padding:16px 20px;
            ">
              <span style="
                font-weight:700;
                font-size:30px;
                text-decoration:underline;
              ">
                Ferguson Bequest
              </span>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding:28px 20px;">
              {{ body|safe }}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="
              background:#002663;
              color:#ffffff;
              padding:12px 20px;
              text-align:center;
              font-weight:600;
            ">
              For queries, contact
              <a href="mailto:fergusonbequest@glasgow.ac.uk"
                 style="color:#ffffff; text-decoration:underline;">
                 fergusonbequest@glasgow.ac.uk
              </a>
              or visit
              <a href="https://www.gla.ac.uk/myglasgow/courtoffice/fergusonbequest/"
                 style="color:#ffffff; text-decoration:underline;">
                 University of Glasgow – Ferguson Bequest
              </a>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
