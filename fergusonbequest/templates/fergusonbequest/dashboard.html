{% extends "fergusonbequest/base.html" %}
{% load static %}

{% block title %}Dashboard – Ferguson Bequest{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'fergusonbequest/css/dashboard.css' %}?v=3">
<link rel="stylesheet" href="{% static 'fergusonbequest/css/calendar.css' %}?v=3">
{% endblock %}

{% block content %}

<div class="fb-container">
  

  <h1 class="fb-h1">Dashboard</h1>

  <div class="ud-grid">

    <div class="fb-card">
      <div class="ud-main">
        {% include 'fergusonbequest/calendar.html' %}
      </div>
    </div>

    <!-- right: quick links -->
    <aside class="ud-side" aria-label="Quick links">
      <div class="fb-card">
        <div class="fb-label">Quick Links</div>

        <div class="mt-3">
          <a class="ud-link" href="{% url 'create_attraction_suggestion' %}">
            <span class="ud-link__icon" aria-hidden="true">💡</span>
            <span class="ud-link__text">Suggest an attraction</span>
            <span class="ud-link__chev" aria-hidden="true">›</span>
          </a>
        </div>
      </div>
    </aside>

  </div>

</div>

{% endblock %}
